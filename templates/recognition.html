{% extends "base.html" %}{% block title %}Face Recognition System{% endblock %}{% block content %}
<div class="recognition-page"><h1>FACE RECOGNITION SYSTEM</h1><div class="rec-grid"><div class="rec-image"><img src="{{url_for('static',filename='images/rohit.jpeg')}}"></div><div class="rec-camera"><video id="video" autoplay playsinline></video><canvas id="canvas" hidden></canvas><img id="resultImg"><div class="button-row"><button class="btn green" onclick="startRecognition()">START CAMERA</button><button class="btn blue" onclick="testRecognition()">TEST MODE</button><button class="btn red" onclick="stopRecognition()">STOP CAMERA</button></div><div id="recStatus">Current slot: {{slot}}</div><div id="recognized"></div></div></div></div>{% endblock %}
