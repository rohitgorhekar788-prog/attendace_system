<div class="attendance-page"><div class="att-header"><img src="{{url_for('static',filename='images/panda.jpeg')}}"><img src="{{url_for('static',filename='images/ant.jpeg')}}"></div><h1>COLLEGE ATTENDANCE MANAGEMENT SYSTEM</h1><div class="panel"><h2>Attendance Records</h2><div class="table-scroll"><table><thead><tr><th>ID</th><th>Roll</th><th>Name</th><th>Department</th><th>Lecture</th><th>Time</th><th>Date</th><th>Status</th></tr></thead><tbody>{% for r in rows %}<tr>{% for v in r %}<td>{{v}}</td>{% endfor %}</tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
